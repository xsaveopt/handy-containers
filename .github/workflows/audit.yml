name: Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grype:
    name: grype (${{ matrix.file }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: [ffprobe.Dockerfile, unpacker.Dockerfile]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          pull: true
          load: true
          tags: audit:local

      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439
        with:
          image: audit:local
          severity-cutoff: high
          only-fixed: true
          output-format: table
